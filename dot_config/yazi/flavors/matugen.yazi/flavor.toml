# Generated by matugen. Do not edit by hand.
# This is a yazi *flavor*. Enable it by putting ONLY this in ~/.config/yazi/theme.toml
# (anything else there overrides the flavor, which is fine for tweaks):
#   [flavor]
#   dark = "matugen"
#   light = "matugen"

[mgr]
cwd = { fg = "#7393b3" }

find_keyword = { fg = "#dbbc7f", bold = true, italic = true, underline = true }
find_position = { fg = "#d699b6", bg = "reset", bold = true, italic = true }

marker_copied = { fg = "#83c092", bg = "#83c092" }
marker_cut = { fg = "#e67e80", bg = "#e67e80" }
marker_marked = { fg = "#7393b3", bg = "#7393b3" }
marker_selected = { fg = "#dbbc7f", bg = "#dbbc7f" }

count_copied = { fg = "#323c41", bg = "#83c092" }
count_cut = { fg = "#323c41", bg = "#e67e80" }
count_selected = { fg = "#323c41", bg = "#dbbc7f" }

border_symbol = "│"
border_style = { fg = "#4e565c" }

[tabs]
active = { fg = "#323c41", bg = "#83c092", bold = true }
inactive = { fg = "#83c092", bg = "#3d454b" }

[mode]
normal_main = { fg = "#323c41", bg = "#83c092", bold = true }
normal_alt = { fg = "#d3c6aa", bg = "#4e565c", bold = true }

select_main = { fg = "#323c41", bg = "#e67e80", bold = true }
select_alt = { fg = "#d3c6aa", bg = "#4e565c", bold = true }

unset_main = { fg = "#323c41", bg = "#7393b3", bold = true }
unset_alt = { fg = "#d3c6aa", bg = "#4e565c", bold = true }

[status]
overall = { fg = "#656d73" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_sep = { fg = "#656d73" }
perm_type = { fg = "#83c092" }
perm_read = { fg = "#dbbc7f" }
perm_write = { fg = "#e67e80" }
perm_exec = { fg = "#7393b3" }

progress_label = { bold = true }
progress_normal = { fg = "#7393b3", bg = "#272f35" }
progress_error = { fg = "#e67e80", bg = "#272f35" }

[pick]
border = { fg = "#7393b3" }
active = { fg = "#d699b6", bold = true }
inactive = {}

[input]
border = { fg = "#7393b3" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "#7393b3" }

[tasks]
border = { fg = "#7393b3" }
title = {}
hovered = { fg = "#d699b6", underline = true }

[which]
mask = { bg = "reset" }
cand = { fg = "#e67e80" }
rest = { fg = "#2b3339" }
desc = { fg = "#7393b3" }
separator = "  "
separator_style = { fg = "#83c092" }

[help]
on = { fg = "#7393b3" }
run = { fg = "#d699b6" }
hovered = { reversed = true, bold = true }
footer = { fg = "#2b3339", bg = "#d3c6aa" }

[spot]
border = { fg = "#7393b3" }
title = { fg = "#7393b3" }
tbl_col = { fg = "#7393b3" }
tbl_cell = { fg = "#dbbc7f", reversed = true }

[notify]
title_info = { fg = "#83c092" }
title_warn = { fg = "#dbbc7f" }
title_error = { fg = "#e67e80" }

[indicator]
current = { bg = "#323c41" }

[icon]
prepend_conds = [
  { if = "dir", text = "󰉋", fg = "#7393b3" },
  { if = "!dir", text = "", fg = "#d3c6aa" },
]

[filetype]
rules = [
  { mime = "image/*", fg = "#7393b3" },
  { mime = "{audio,video}/*", fg = "#d699b6" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e67e80" },
  { mime = "application/{pdf,doc,rtf}", fg = "#7393b3" },
  { mime = "vfs/{absent,stale}", fg = "#4e565c" },
  { url = "*/", fg = "#83c092" },
]
