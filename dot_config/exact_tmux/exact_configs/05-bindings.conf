# Prefix key is set in 01-settings.conf; press it twice to send it through
bind C-Space send-prefix

# Easy config reload
bind R source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded."

bind : command-prompt
bind r refresh-client

# use vim-like keys for splits and windows
bind c kill-pane
bind n new-window
bind s split-window -v
bind v split-window -h

# Navigate next/previous window
bind M-p previous-window
bind M-n next-window

# prefix + C-h/j/k/l always passthrough to the app.
bind C-h send-keys C-h
bind C-j send-keys C-j
bind C-k send-keys C-k
bind C-l send-keys C-l

# Single passthrough check: C-h/j/k/l go straight to the app when any of these own the pane
is_lazygit="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?lazygit$'"
is_vim="ps -o state= -o comm= -t '#{pane_tty}'  | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
passthrough="($is_lazygit) || ($is_vim)"

bind -n 'C-h' if-shell "$passthrough" { send-keys C-h } { if-shell -F '#{pane_at_left}'   {} { select-pane -L } }
bind -n 'C-j' if-shell "$passthrough" { send-keys C-j } { if-shell -F '#{pane_at_bottom}' {} { select-pane -D } }
bind -n 'C-k' if-shell "$passthrough" { send-keys C-k } { if-shell -F '#{pane_at_top}'    {} { select-pane -U } }
bind -n 'C-l' if-shell "$passthrough" { send-keys C-l } { if-shell -F '#{pane_at_right}'  {} { select-pane -R } }

# navigate panes regardless of `passthrough` with prefix+key
bind h if-shell -F '#{pane_at_left}'   {} { select-pane -L }
bind j if-shell -F '#{pane_at_bottom}' {} { select-pane -D }
bind k if-shell -F '#{pane_at_top}'    {} { select-pane -U }
bind l if-shell -F '#{pane_at_right}'  {} { select-pane -R }

bind -T copy-mode-vi 'C-h' if-shell -F '#{pane_at_left}'   {} { select-pane -L }
bind -T copy-mode-vi 'C-j' if-shell -F '#{pane_at_bottom}' {} { select-pane -D }
bind -T copy-mode-vi 'C-k' if-shell -F '#{pane_at_top}'    {} { select-pane -U }
bind -T copy-mode-vi 'C-l' if-shell -F '#{pane_at_right}'  {} { select-pane -R }

# Resize + enter resize mode (don't need to keep pressing prefix)
bind C-Up resize-pane -U 5 \; switch-client -T resize \; display-message "Resize mode"
bind C-Down resize-pane -D 5 \; switch-client -T resize \; display-message "Resize mode"
bind C-Left resize-pane -L 5 \; switch-client -T resize \; display-message "Resize mode"
bind C-Right resize-pane -R 5 \; switch-client -T resize \; display-message "Resize mode"
bind -T resize C-Up resize-pane -U 5 \; switch-client -T resize\; display-message "Resize mode"
bind -T resize C-Down resize-pane -D 5 \; switch-client -T resize\; display-message "Resize mode"
bind -T resize C-Left resize-pane -L 5 \; switch-client -T resize\; display-message "Resize mode"
bind -T resize C-Right resize-pane -R 5 \; switch-client -T resize\; display-message "Resize mode"
bind -T resize q switch-client -T root
bind -T resize Enter switch-client -T root

# Copy/paste-buffer mode
unbind -T copy-mode-vi MouseDragEnd1Pane
bind [ if-shell "$is_vim" { send-keys C-Space [ } { copy-mode }
bind C-[ copy-mode # force copy-mode
bind p paste-buffer

# Search in copy mode
bind / copy-mode \; send-keys /
bind ? copy-mode \; send-keys ?
bind C-f copy-mode \; send-keys C-f # tmux-flash

# Setup 'v' to begin selection as in Vim
bind -T copy-mode-vi v send -X begin-selection

## vi-like text objects in copy mode: `v` then `i` + object
bind -T copy-mode-vi i switch-client -T text-object
bind -T text-object w send -X select-word
bind -T text-object W set -g word-separators " 	" \; send -X select-word \; set -gu word-separators

# Floating tmux session with C-_, single session with per-session windows
bind "C-_" if-shell -F '#{==:#{session_name},floating-tmux}' {
  detach-client
} {
  run-shell "tmux display-popup -w 80% -h 60% -b rounded -E '\
    tmux new-session -d -s floating-tmux 2>/dev/null; \
    tmux new-window -S -n \"#{session_name}\" -t floating-tmux; \
    tmux attach-session -t \"floating-tmux:#{session_name}\"'"
}

# ─────────────────────────────────────────────────────────────
# workmux: https://github.com/raine/workmux
# ─────────────────────────────────────────────────────────────
bind "e" display-popup -E -w 100% -h 100% "workmux dashboard --preview-size 50"
bind "E" run-shell "workmux sidebar"

bind g display-menu -x C -y C -b rounded -T "#[fg=#{@thm_green}]workmux" \
    "add <branch>" a "popup -d '#{pane_current_path}' -w 80% -h 20% -x C -y C -E '~/.config/tmux/scripts/workmux/add-branch.sh'" \
    "add from selected branch" b "popup -d '#{pane_current_path}' -w 80% -h 25% -x C -y C -E '~/.config/tmux/scripts/workmux/add-from-branch.sh'" \
    "add with prompt" p "popup -d '#{pane_current_path}' -w 80% -h 20% -x C -y C -E '~/.config/tmux/scripts/workmux/add-prompt.sh'" \
    "quit" q ""

## Jump back to the work session you were in before selecting an agent in workmux
## Any workmux-tracked agent pane is skipped, so an agent -> agent -> agent chain still
## returns you to where you started.
bind -N "return to pre-agent session" BSpace run-shell "~/.config/tmux/scripts/workmux-return.sh \"#{client_tty}\""

# ─────────────────────────────────────────────────────────────
# sesh: https://github.com/joshmedeski/sesh
# ─────────────────────────────────────────────────────────────
bind "t" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --prompt '  ' \
    --style 'minimal' \
    --header '^a all ^b blacklist ^t tmux ^g configs ^d zoxide ^x tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(  )+reload(sesh list --icons)' \
    --bind 'ctrl-b:change-prompt(  )+reload(sesh list -b --icons)' \
    --bind 'ctrl-t:change-prompt(  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-d:change-prompt(  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-x:execute(tmux kill-session -t {2..})+change-prompt(  )+reload(sesh list --icons)' \
    --preview-window 'right:50%' \
    --preview 'sesh preview {}' \
    --gutter ' '
)\""

# prefix+L won't find the last session if detach-on-destroy is off. This finds the 2nd last session
bind -N "last-session (via sesh) " L run-shell "sesh last"
