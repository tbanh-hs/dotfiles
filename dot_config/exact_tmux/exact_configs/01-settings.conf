# Use C-Space as the prefix key
set -g prefix C-Space
unbind-key C-b

# window index start at 1, easier to prefix + number
set -g base-index 1
set -g renumber-windows on

# vim key bindings in copy mode
set -g mode-keys vi

# Address vim mode switching delay (http://superuser.com/a/252717/65504)
# set -sg escape-time 5

# mouse behavior
set -g mouse on

# Use the system clipboard
set -g set-clipboard on

# Pass through image preview
set -gq allow-passthrough on

# Terminal
set -g default-terminal "${TERM}"
set -s extended-keys on
set -s extended-keys-format csi-u
set -s terminal-features[3] '*:RGB'
set -s terminal-features[4] '*:extkeys'
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Don't detach on destroy, so that we can see the output of the last command
set -g detach-on-destroy off

set -g other-pane-height 25
set -g other-pane-width 80
set -g display-panes-time 1500

set -g focus-events on

# Update PATH for tmux run-shell, so that it can find fzf and other tools
set -ga update-environment "PATH"

# Status Bar
set -g status-interval 5

# Set window notifications
set -g monitor-activity off
set -g visual-activity off

if-shell '[ "$(uname -s)" = "Darwin" ]' ' \
  set -g default-command "reattach-to-user-namespace -l $SHELL"; \
'

# Allow the arrow key to be used immediately after changing windows
set -g repeat-time 0

## Automatically rename windows to match the current command
set -g automatic-rename on
set -g automatic-rename-format "Window"
