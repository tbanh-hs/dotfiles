#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json

blacklist = [
  "claude ",
  "floating-tmux",
  '\[sidekick\]',
  'floating\|',
]

[[window]]
name = "opencode"
startup_script = "opencode --continue"

[[window]]
name = "nvim"
startup_script = "nvim"

[default_session]
startup_command = "nvim -c \":lua require('persistence').load()\""
preview_command = "eza --all --git --icons --long --group-directories-first --color=always {}"

[[session]]
name = "chezmoi"
path = "~/.local/share/chezmoi"
startup_command = "chezmoi re-add && lazygit && tmux kill-session"
windows = ["nvim"]

[[session]]
name = "downloads"
path = "~/Downloads"
startup_command = "yazi"

[[session]]
name = "matugen"
path = "~/.config/matugen"
startup_command = "nvim"

[[session]]
name = "nvim config"
path = "~/.config/nvim"
startup_command = "nvim"

[[session]]
name = "opencode config"
path = "~/.config/opencode"
startup_command = "nvim"

[[session]]
name = "pi config"
path = "~/.pi/agent"
startup_command = "nvim"

[[session]]
name = "sesh config"
path = "~/.config/sesh"
startup_command = "nvim sesh.toml"
preview_command = "bat --color=always ~/.config/sesh/sesh.toml"

[[session]]
name = "/src"
path = "~/src"
startup_command = "ls"

[[session]]
name = "tmux config"
path = "~/.config/tmux"
startup_command = "nvim"

[[session]]
name = "zsh config"
path = "~/"
startup_command = "nvim .zshrc"
preview_command = "bat --color=always ~/.zshrc"

[[session]]
name = "chezmoi - work"
path = "~/dotfiles-work"
startup_command = "chezmoi -S {} re-add && lazygit && tmux kill-session"
windows = ["nvim"]
