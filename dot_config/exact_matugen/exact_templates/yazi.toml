# Generated by matugen. Do not edit by hand.
# This is a yazi *flavor*. Enable it by putting ONLY this in ~/.config/yazi/theme.toml
# (anything else there overrides the flavor, which is fine for tweaks):
#   [flavor]
#   dark = "matugen"
#   light = "matugen"

[mgr]
cwd = { fg = "{{ colors.secondary.default.hex }}" }

find_keyword = { fg = "{{ base16.base0a.default.hex }}", bold = true, italic = true, underline = true }
find_position = { fg = "{{ base16.base0e.default.hex }}", bg = "reset", bold = true, italic = true }

marker_copied = { fg = "{{ base16.base0b.default.hex }}", bg = "{{ base16.base0b.default.hex }}" }
marker_cut = { fg = "{{ base16.base08.default.hex }}", bg = "{{ base16.base08.default.hex }}" }
marker_marked = { fg = "{{ colors.secondary.default.hex }}", bg = "{{ colors.secondary.default.hex }}" }
marker_selected = { fg = "{{ base16.base0a.default.hex }}", bg = "{{ base16.base0a.default.hex }}" }

count_copied = { fg = "{{ base16.base01.default.hex }}", bg = "{{ base16.base0b.default.hex }}" }
count_cut = { fg = "{{ base16.base01.default.hex }}", bg = "{{ base16.base08.default.hex }}" }
count_selected = { fg = "{{ base16.base01.default.hex }}", bg = "{{ base16.base0a.default.hex }}" }

border_symbol = "│"
border_style = { fg = "{{ colors.outline.default.hex }}" }

[tabs]
active = { fg = "{{ base16.base01.default.hex }}", bg = "{{ base16.base0b.default.hex }}", bold = true }
inactive = { fg = "{{ base16.base0b.default.hex }}", bg = "{{ colors.surface_variant.default.hex }}" }

[mode]
normal_main = { fg = "{{ base16.base01.default.hex }}", bg = "{{ base16.base0b.default.hex }}", bold = true }
normal_alt = { fg = "{{ colors.on_surface.default.hex }}", bg = "{{ colors.outline.default.hex }}", bold = true }

select_main = { fg = "{{ base16.base01.default.hex }}", bg = "{{ base16.base08.default.hex }}", bold = true }
select_alt = { fg = "{{ colors.on_surface.default.hex }}", bg = "{{ colors.outline.default.hex }}", bold = true }

unset_main = { fg = "{{ base16.base01.default.hex }}", bg = "{{ colors.secondary.default.hex }}", bold = true }
unset_alt = { fg = "{{ colors.on_surface.default.hex }}", bg = "{{ colors.outline.default.hex }}", bold = true }

[status]
overall = { fg = "{{ colors.on_surface_variant.default.hex }}" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_sep = { fg = "{{ colors.on_surface_variant.default.hex }}" }
perm_type = { fg = "{{ base16.base0b.default.hex }}" }
perm_read = { fg = "{{ base16.base0a.default.hex }}" }
perm_write = { fg = "{{ base16.base08.default.hex }}" }
perm_exec = { fg = "{{ colors.secondary.default.hex }}" }

progress_label = { bold = true }
progress_normal = { fg = "{{ colors.secondary.default.hex }}", bg = "{{ colors.background.default.hex }}" }
progress_error = { fg = "{{ base16.base08.default.hex }}", bg = "{{ colors.background.default.hex }}" }

[pick]
border = { fg = "{{ colors.secondary.default.hex }}" }
active = { fg = "{{ base16.base0e.default.hex }}", bold = true }
inactive = {}

[input]
border = { fg = "{{ colors.secondary.default.hex }}" }
title = {}
value = {}
selected = { reversed = true }

[cmp]
border = { fg = "{{ colors.secondary.default.hex }}" }

[tasks]
border = { fg = "{{ colors.secondary.default.hex }}" }
title = {}
hovered = { fg = "{{ base16.base0e.default.hex }}", underline = true }

[which]
mask = { bg = "reset" }
cand = { fg = "{{ base16.base08.default.hex }}" }
rest = { fg = "{{ colors.surface.default.hex }}" }
desc = { fg = "{{ colors.secondary.default.hex }}" }
separator = "  "
separator_style = { fg = "{{ base16.base0b.default.hex }}" }

[help]
on = { fg = "{{ colors.secondary.default.hex }}" }
run = { fg = "{{ base16.base0e.default.hex }}" }
hovered = { reversed = true, bold = true }
footer = { fg = "{{ colors.surface.default.hex }}", bg = "{{ base16.base05.default.hex }}" }

[spot]
border = { fg = "{{ colors.secondary.default.hex }}" }
title = { fg = "{{ colors.secondary.default.hex }}" }
tbl_col = { fg = "{{ colors.secondary.default.hex }}" }
tbl_cell = { fg = "{{ base16.base0a.default.hex }}", reversed = true }

[notify]
title_info = { fg = "{{ base16.base0b.default.hex }}" }
title_warn = { fg = "{{ base16.base0a.default.hex }}" }
title_error = { fg = "{{ base16.base08.default.hex }}" }

[indicator]
current = { bg = "{{ base16.base01.default.hex }}" }

[icon]
prepend_conds = [
  { if = "dir", text = "󰉋", fg = "{{ colors.secondary.default.hex }}" },
  { if = "!dir", text = "", fg = "{{ colors.on_surface.default.hex }}" },
]

[filetype]
rules = [
  { mime = "image/*", fg = "{{ colors.secondary.default.hex }}" },
  { mime = "{audio,video}/*", fg = "{{ base16.base0e.default.hex }}" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "{{ base16.base08.default.hex }}" },
  { mime = "application/{pdf,doc,rtf}", fg = "{{ colors.secondary.default.hex }}" },
  { mime = "vfs/{absent,stale}", fg = "{{ colors.outline.default.hex }}" },
  { url = "*/", fg = "{{ base16.base0b.default.hex }}" },
]
